name: Build UI

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install npm dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Run tests
        run: |
          cd frontend
          npm test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui-build_${{ github.run_number }}
          path: dist  # TODO: Update to use a docker image
          retention-days: 90
